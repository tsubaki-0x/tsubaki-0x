  <text x="59" y="154" fill="#d9f3f8" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Monaco,Consolas,monospace" font-size="12.5" letter-spacing="1.5">VIBECODER / AI-ASSISTED / LOCALIZATION</text>
