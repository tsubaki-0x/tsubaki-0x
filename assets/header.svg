<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SUZU profile">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#f6fbfd"/>
    <stop offset="1" stop-color="#dff3f7"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="0%" r="75%">
    <stop offset="0" stop-color="#bceaf3" stop-opacity=".72"/>
    <stop offset=".52" stop-color="#dff5f8" stop-opacity=".28"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0b416c" stop-opacity="0"/>
    <stop offset=".18" stop-color="#0b416c" stop-opacity=".58"/>
    <stop offset=".82" stop-color="#8fd8e8" stop-opacity=".70"/>
    <stop offset="1" stop-color="#8fd8e8" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1200" height="420" rx="28" fill="url(#sky)"/>
<ellipse cx="600" cy="26" rx="470" ry="250" fill="url(#halo)"/>

<text x="600" y="72" text-anchor="middle" fill="#0b416c" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="650" letter-spacing="2.8">SUZU</text>

<text x="600" y="178" text-anchor="middle" fill="#102f47" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Localize what was once unreachable.</text>

<text x="600" y="223" text-anchor="middle" fill="#607988" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Arial,sans-serif" font-size="19">Vibecoding, reverse engineering and AI-assisted localization.</text>

<text x="600" y="277" text-anchor="middle" fill="#385c72" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Monaco,Consolas,monospace" font-size="13" letter-spacing="1.35">AI-ASSISTED / HUMAN-DIRECTED / PT-BR</text>

<rect x="210" y="329" width="780" height="1.5" fill="url(#rule)"/>

<g transform="translate(600 357)">
  <circle r="11" fill="#edf9fb" stroke="#86cbd9" stroke-width="1"/>
  <circle r="3.2" fill="#0b416c">
    <animate attributeName="r" values="2.4;4;2.4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="-11" r="1.7" fill="#e2736c">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
  </circle>
</g>

<text x="600" y="392" text-anchor="middle" fill="#8ba0ac" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Monaco,Consolas,monospace" font-size="11.5" letter-spacing=".8">SCHOOL DAYS / CURIOSITY / LOCALIZATION</text>
</svg>
