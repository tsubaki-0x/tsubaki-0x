    <animate attributeName="r" values="4.0;6.4;4.0" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.72;0.28" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="9" cy="9" r="2.15" fill="#dce5ff">
