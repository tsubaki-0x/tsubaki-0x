<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" role="img" aria-label="animated signal">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9efff"/>
      <stop offset="0.45" stop-color="#8da2ff"/>
      <stop offset="1" stop-color="#5164c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="9" cy="9" r="7.6" fill="none" stroke="#26314b" stroke-width="1"/>
