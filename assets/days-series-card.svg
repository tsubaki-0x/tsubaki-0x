<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Days Series PT-BR project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8196ff"/>
      <stop offset="1" stop-color="#a992ff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="228" rx="18" fill="url(#bg)" stroke="#1d2635"/>
  <rect x="30" y="28" width="5" height="174" rx="2.5" fill="url(#line)"/>

  <text x="68" y="56" fill="#79859a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.2">MAIN PROJECT</text>
  <text x="68" y="105" fill="#eef2fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="2.5">DAYS SERIES PT-BR</text>
  <text x="69" y="136" fill="#9aa5b9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">translation · technical research · tooling · compatibility</text>
  <text x="69" y="171" fill="#697488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">School Days · Shiny Days · Summer Days · Cross Days · Island Days</text>

  <g transform="translate(930 115)">
    <circle r="62" fill="none" stroke="#1f2b43"/>
    <circle r="44" fill="none" stroke="#263652" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#8ea2ff">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="-7" fill="#8290a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">REGION</text>
    <text x="88" y="14" fill="#cbd4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">BR / PT-BR</text>
  </g>

  <text x="1134" y="201" text-anchor="end" fill="#7f92ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">VIEW PROJECT ↗</text>
</svg>
